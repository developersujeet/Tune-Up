<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tune Up</title>
  <style>
    /* General Styles */
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1e1e1e, #121212);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .music-player {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
      color: #fff;
    }

    /* Search Box */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
    }

    .search-box input::placeholder {
      color: #ccc;
    }

    .search-box button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #ff6f61;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .search-box button:hover {
      background: #ff4a3d;
    }

    /* Search Results */
    .search-results {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .search-results div {
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .search-results div:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .controls button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #ff6f61;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .controls button:hover {
      background: #ff4a3d;
    }

    /* Player */
    #player {
      display: none; /* Hidden YouTube player */
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</head>
<body>
  <div class="music-player">
    <h1>Tune Up</h1>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search for a song...">
      <button id="search-button">Search</button>
    </div>
    <div class="search-results" id="search-results"></div>
    <div id="player"></div>
    <div class="controls">
      <button id="prev">Previous</button>
      <button id="play-pause">Play</button>
      <button id="next">Next</button>
    </div>
  </div>

  <script>
    // YouTube IFrame API
    let player;
    let currentSongIndex = 0;
    let searchResults = [];

    // Load YouTube IFrame API
    function loadYouTubeAPI() {
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // Initialize YouTube Player
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0', // Hidden player
        width: '0',
        playerVars: {
          autoplay: 0,
          controls: 0,
          modestbranding: 1,
          showinfo: 0,
          fs: 0,
          rel: 0,
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
        },
      });
    }

    // When the player is ready
    function onPlayerReady(event) {
      console.log('Player is ready');
    }

    // When the player state changes
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNextSong();
      }
    }

    // Play/Pause functionality
    const playPauseButton = document.getElementById('play-pause');
    playPauseButton.addEventListener('click', () => {
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        playPauseButton.textContent = 'Play';
      } else {
        player.playVideo();
        playPauseButton.textContent = 'Pause';
      }
    });

    // Previous song
    const prevButton = document.getElementById('prev');
    prevButton.addEventListener('click', playPreviousSong);

    // Next song
    const nextButton = document.getElementById('next');
    nextButton.addEventListener('click', playNextSong);

    // Play previous song
    function playPreviousSong() {
      if (searchResults.length === 0) return;
      currentSongIndex = (currentSongIndex - 1 + searchResults.length) % searchResults.length;
      loadSong(currentSongIndex);
    }

    // Play next song
    function playNextSong() {
      if (searchResults.length === 0) return;
      currentSongIndex = (currentSongIndex + 1) % searchResults.length;
      loadSong(currentSongIndex);
    }

    // Load a song by index
    function loadSong(index) {
      const videoId = searchResults[index].id.videoId;
      player.loadVideoById(videoId);
      player.playVideo();
      playPauseButton.textContent = 'Pause';
    }

    // Search for songs using the backend
    const searchButton = document.getElementById('search-button');
    searchButton.addEventListener('click', searchSongs);

    async function searchSongs() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      try {
        const response = await fetch(`/search?q=${query}`);
        const data = await response.json();
        searchResults = data;
        displaySearchResults();
      } catch (error) {
        console.error('Error fetching search results:', error);
      }
    }

    // Display search results
    function displaySearchResults() {
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = searchResults
        .map(
          (result, index) => `
            <div data-index="${index}">
              ${result.snippet.title}
            </div>
          `
        )
        .join('');

      // Add click event listeners to search results
      resultsContainer.querySelectorAll('div').forEach((result, index) => {
        result.addEventListener('click', () => {
          currentSongIndex = index;
          loadSong(currentSongIndex);
        });
      });
    }

    // Load YouTube API on page load
    loadYouTubeAPI();
  </script>
</body>
</html>
